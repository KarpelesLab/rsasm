[package]
name = "rsasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A multi-syntax, multi-architecture assembler"
license = "MIT"
repository = "https://github.com/KarpelesLab/rsasm"
readme = "README.md"
keywords = ["assembler", "asm", "x86", "codegen"]
categories = ["development-tools"]

[package.metadata.docs.rs]
# Document every architecture backend, not just the default set. Mirrors the
# CI docs job.
all-features = true

[dependencies]

[features]
default = ["x86"]
# One feature per CPU architecture backend. All are enabled by default; build
# with --no-default-features --features <arch> for a slimmer binary.
x86 = []

[lib]
name = "rsasm"
path = "src/lib.rs"

[[bin]]
name = "rsasm"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
